gramming (OOP)",week:"Weeks 9–10",tagline:"Classes, `self`, inheritance, `super()`, and class vs. instance attribute lookup.",examFocus:"PE Q3 • Final",examples:[{title:"Inheritance, `super()` & Method Resolution Order (MRO)",summary:"Subclasses inherit attributes and methods from parents. Use `super()` to reuse parent logic without hardcoding the parent class name.",code:`class Account:
