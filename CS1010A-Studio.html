25 10`,keyPoints:['Falsy values in Python: `False`, `None`, `0`, `0.0`, `""`, `()`, `[]`, `{}`.',"`=` is assignment, `==` checks equality, `!=` checks inequality; use `\\` to escape quotes like `'That\\'s'`.","In Lecture 2 (`runes.py`), `show(pic)` displays a picture as a side effect and returns `None`; `return` passes a value back."]},{title:"Black-Box Abstraction & Picture Language (`runes.py`)",summary:"Functional abstraction treats a function as a black box: callers only care WHAT it computes, not HOW it is implemented. Complex picture operations are built from a few primitives.",code:`from math import exp, log

# Two implementations with the exact same specification (WHAT):
def square_v1(x):
    return x * x

def square_v2(x):
    return exp(2 * log(x))       # works for x > 0; caller code unchanged!

# Picture language (Lecture 2): build derived ops from primitives
# Primitives: quarter_turn_right, stack, stack_frac, overlay, scale
def turn_upside_down(pic):
    return quarter_turn_right(quarter_turn_right(pic))

def quarter_turn_left(pic):
    return turn_upside_down(quarter_turn_right(pic))

def beside(pic1, pic2):
    return quarter_turn_right(
        stack(quarter_turn_left(pic2), quarter_turn_left(pic1))
    )`,keyPoints:["7 properties of good abstraction (L2): natural subtasks (divide & conquer), easier to understand, captures common patterns, code reuse, hides irrelevant details, separates WHAT from HOW, and makes debugging easier.","Because `beside` and `make_cross` only rely on primitive specifications, changing a primitive implementation never breaks derived functions.","Functions are objects in Python: `foo = lambda pic: beside(pic, pic)` binds an anonymous function to a name."]},{title:"Wishful Thinking, Block Structure & No Magic Numbers",summary:'Top-down design ("wishful thinking") assumes helper functions already exist, then implements them. Name constants to avoid magic numbers and nest private helpers using block structure.',code:`from math import sqrt, ceil

# Block structure: sum_of_squares is local to hypotenuse
def hypotenuse(a, b):
    def sum_of_squares(x, y):
        return x * x + y * y
    return sqrt(sum_of_squares(a, b))

# Wishful thinking + named constants (Lecture 2 Comfort Delgro taxi_fare):
def taxi_fare(distance):
    stage1, stage2 = 1000, 10000
    start_fare, increment = 3.20, 0.22
    block1, block2 = 400, 350

    if distance <= stage1:
        return start_fare
    elif distance <= stage2:
        return start_fare + ceil((distance - stage1) / block1) * increment
    else:
        return taxi_fare(stage2) + ceil((distance - stage2) / block2) * increment

print(round(taxi_fare(12000), 2))`,output:"9.58",keyPoints:["Calling `taxi_fare(stage2)` reuses the stage-2 boundary fare via wishful thinking instead of hardcoding `8.26`.","Replacing raw numbers (`400`, `350`, `0.22`) with named variables makes fare changes a one-line edit.","Helper functions nested inside another function (`sum_of_squares`) keep the global namespace clean."]},{title:"Variable Scope: Bound vs. Free Variables & Default Args",summary:"Formal parameters are bound variables; names not bound locally are free variables looked up from innermost to outermost scope. Assigning anywhere in a function marks that name local for the whole body.",code:`x = 10

    dx = 0.00001

def newtons_method(g, first_guess):
    dg = deriv(g)
    def improve(x):
        return x - g(x) / dg(x)
    def is_close_enough(v):

            return guess
        return attempt(improve(guess))
    return attempt(first_guess)

wishful thinking, recursion, higher-order functions, signal-processing pipelines), imperative state and mutation (lists, aliasing, dictionaries, files), and object-oriented programming (encapsulation, inheritance, polymorphism, and MRO)."],admonition:{kind:"tip",title:"How to Use These Notes",body:"Each unit follows the NUS online textbook format: start with the Learning Objectives, read through the worked lecture examples and tables, interact with the embedded visualizers, test your intuition on Common Exam Traps, and finish with the Self-Check Practice questions at the bottom. Press `/` or `⌘K` anytime to search across all units."}},{id:"roadmap",title:"The CS1010A Course Road Map (Lecture 12)",paragraphs:["Lecture 12 organizes the entire semester into three progressive tiers. Every unit in the left sidebar maps directly to this official roadmap:"],table:{id:"roadmap-table",title:"CS1010A Syllabus Roadmap (Lectures 1–12)",headers:["Tier","Units","Core Lecture Concepts"],rows:[["Basic","Units 01–02","Expressions, Functional Abstraction, Wishful Thinking, Scope, Recursion, Iteration, Order of Growth (O/Ω/Θ)"],["Intermediate","Units 03–06","Higher-Order Functions & Closures, Data Abstraction & Abstraction Barriers, Tuples/Trees/Files, Lists & Mutation, Searching & Sorting, Dictionaries, Multiple Representations (Multisets) & Data Pivoting"],["Advanced","Units 07–08","Object-Oriented Programming (Encapsulation, Inheritance, Polymorphism, Diamond MRO) & Exception Handling"]]}},{id:"assessment",title:"Assessment Weightage & Exam Rules",paragraphs:["Knowing the exact exam structure and constraints prevents costly mistakes during the Practical Exam and Finals. Note the progressive scoring policy: if your Final Exam percentage exceeds your Midterm percentage, the Final absorbs the Midterm weight (65% total)."],table:{id:"assessment-table",title:"CS1010A Assessment Overview (Lectures 6, 7, 11, 12)",headers:["Component","Weight","Format & Allowed Materials","Scope & Focus"],rows:[["Coursemology","15%","Continuous missions, trainings, tutorials & recitations","All weekly topics"],["Midterm","20%","Written exam • 1× A4 helpsheet","Up to & including Lecture 6: Expressions, Recursion/Iteration & OOG, HOFs, Data Abstraction (ADT)"],["Practical Exam (PE)","20%","90 mins • Open book (hardcopy + Coursemology) • GLIDE IDLE • 5 Run attempts","3 Qs: Q1 General Problem Solving (Rec/Iter), Q2 Data Processing (Files/Dicts/Pivoting), Q3 OOP"],["Final Exam","45% (up to 65%)","2 hours • 90 marks • 2× double-sided A4 helpsheets","Cumulative (Lectures 1–10 & 12 concepts)"]]}},{id:"syllabus-boundaries",title:"Strict Syllabus Boundaries (What NOT to Use or Over-Study)",paragraphs:["Many generic online Python guides introduce tools or algorithms that are outside the CS1010A syllabus or disallowed in exams. These notes stay strictly inside what your CS1010A lectures actually teach and test:"],bullets:[`**Memoization & Dynamic Programming (Lecture 10)**: Explicitly marked **"Won't come out on PE/Finals"** on Lecture 12 Slide 32. Included in Unit 08 only as a clearly labelled non-examinable reference.`,"**External Data Libraries (Lecture 11)**: NumPy, Pandas, Matplotlib, and Seaborn are shown for visualisation awareness only and **cannot be used in the Practical Exam (PE)** — PE Q2 must be solved in pure Python.","**Sorting Algorithms (Lecture 7)**: Only **Linear Search**, **Binary Search** (non-slicing index helper), **Selection Sort** (Lecture 7's out-of-place, stable version), **Merge Sort**, and built-in `lst.sort()` / `sorted()` are in syllabus (Insertion Sort and Quick Sort are not taught).","**Deep Copying (Lecture 7)**: `copy.deepcopy` is not taught in Lecture 7; instead know shallow `lst.copy()` (`s[2] is t[2]`), recursive `copy_tree` (Lecture 6), and list comprehensions `[[0]*c for _ in range(r)]`."],admonition:{kind:"syllabus",title:"Note on Lectures 1 & 5",body:"Lectures 2, 3, 4, 6, 7, 8, 9, 10, 11, and 12 are covered directly from your uploaded slide decks, along with the Lecture 1 (expressions, conditionals) and Lecture 5 (Data Abstraction Barrier, Constructors/Selectors/Predicates/Printers, `==` vs `is`) foundations recapped in Lectures 6 and 12."}}]},hi={"abstraction-scope":{topicId:"abstraction-scope",slug:"01-abstraction-scope",unitLabel:"Unit 01",shortTitle:"01. Functional Abstraction & Scope",group:"Basic",learningObjectives:["Trace Python expressions accurately, including short-circuiting `and`/`or` return values and `return` vs. side effects (`print`/`show`).","Explain functional abstraction as a black box separating specification (WHAT) from implementation (HOW), and recall the 7 properties of a good abstraction.",'Apply top-down design ("wishful thinking"), block structure (nested helpers), and named constants to avoid magic numbers (`taxi_fare`, `runes.py`).',"Distinguish bound vs. free variables, predict `UnboundLocalError` vs. mutating an outer list element (`y[0] += 1`), and avoid the mutable default argument trap."],introParagraphs:["A central theme of CS1010A is **abstraction**: giving a meaningful name to a computational pattern so you can reason about *what* it does without keeping track of *how* it works internally. Lecture 2 introduces this through both numerical functions (`square`, `hypotenuse`, Comfort Delgro `taxi_fare`) and the visual Picture Language (`runes.py`).","Understanding how Python resolves variable names — bound parameters vs. free variables, block structure, local assignment shadowing, and static default arguments (Lectures 2 & 9) — is essential to prevent subtle bugs that frequently appear in Midterm Q1 and PE Q3."],referenceTable:{id:"good-abstraction-table",title:"7 Properties of a Good Functional Abstraction (Lecture 2)",headers:["#","Property","Lecture 2 Example"],rows:[["1","Breaks problems into natural subtasks (divide & conquer)","`hypotenuse` → `sum_of_squares` → `square`"],["2","Makes programs easier to read & understand","Named helpers + avoiding magic numbers in `taxi_fare`"],["3","Captures common patterns","`repeat_pattern`, `stackn`, `nxn`"],["4","Enables code reuse","`square` reused in `sum_of_squares` & `circle_area`"],["5","Hides irrelevant implementation details","Callers use `beside` without worrying about rotations"],["6","Separates specification (WHAT) from implementation (HOW)","`square(x)` as `x * x` vs `exp(2 * log(x))`"],["7","Makes debugging and modification easier","Changing `block1` or `increment` in one place"]]},admonitions:[{kind:"note",title:"Runes Picture Language Depth Map (Lecture 2)",body:"In `runes.py`, 3D overlays use a greyscale depth map where **Black = nearest** and **White = furthest**, enabling stereograms and red/blue anaglyphs."},{kind:"warning",title:"Quirk of Python: `nonlocal` (Lecture 9)",body:'Lecture 9 mentions `nonlocal x` as "a quirk of Python, for knowledge only" to rebind an enclosing function\'s variable. For exams, remember the core rule: ANY assignment (`=`, `+=`) to `x` inside a function makes `x` local across the entire function body.'}]},"recursion-growth":{topicId:"recursion-growth",slug:"02-recursion-growth",unitLabel:"Unit 02",shortTitle:"02. Recursion, Iteration & Growth",group:"Basic",learningObjectives:["Design linear, tree, and mutual recursive functions with complete base cases and valid reductions toward termination.","Distinguish a recursive process (deferred operations on the call stack) from an iterative process (state captured in variables, constant space).","Apply logarithmic divide-and-conquer (`fast_expt`, Euclid's `gcd`) and disjoint-set splitting (Counting Change `cc`).","Analyze Time and Space Order of Growth using `O`, `Ω`, and `Θ` notation, dropping constants, lower-order terms, and logarithm bases."],introParagraphs:["Recursion solves a problem by reducing it to smaller instances of the exact same problem (like reducing an `n×n` 15-puzzle step-by-step down to `2×2`). Every valid recursive function mirrors mathematical induction: it needs terminating **base case(s)** and **recursive step(s)** guaranteed to reach a base case.","Crucially, **two functions that compute the exact same answer can consume wildly different Time and Space**. Order of Growth (`O`, `Ω`, `Θ`) lets us compare algorithms independent of hardware speed by focusing on how resource consumption `R(n)` scales as `n` grows large."],referenceTable:{id:"lec3-complexity-table",title:"Canonical Lecture 3–4 Time & Space Complexities",headers:["Function","Process Type","Time Complexity","Space Complexity"],rows:[["`fact_rec(n)`","Linear recursive (deferred `*`)","`O(n)`","`O(n)`"],["`fact_iter(n)`","Iterative (`product, counter`)","`O(n)`","`O(1)`"],["`fib(n)` (naive)","Tree recursive (`fib(n+1)` leaves)","`O(Φⁿ)` (`Φ ≈ 1.618`)","`O(n)` (tree depth)"],["`power(b, e)`","Linear recursive","`O(e)`","`O(e)`"],["`fast_expt(b, e)`","Halving recursive `(b²)^(e/2)`","`O(log e)`","`O(log e)`"],["`cc(a, k)`","Tree recursive (2 disjoint sets)","`O(2ᵃ)`","`O(a)` (`L = a + k`)"]],footnote:"At 10⁹ operations/sec, 2⁵⁹ steps takes roughly 13.7 billion years (age of the universe) — showing why exponential algorithms become unusable even for modest `n`."},admonitions:[{kind:"note",title:"Stack vs. Heap in PythonTutor (Lecture 4)",body:"When tracing Space complexity, remember that active function call frames live on the **Stack** (depth of pending calls), while created data objects (tuples, lists, closures) live on the **Heap**."}]},hof:{topicId:"hof",slug:"03-hof",unitLabel:"Unit 03",shortTitle:"03. Higher-Order Functions",group:"Intermediate",learningObjectives:["Treat functions as first-class objects: assign them to variables, pass them as arguments, and return them as results.","Abstract repetitive summation, product, and accumulation patterns using `sum`, `integral`, `fold`, and `fold2`.","Trace closures (functions capturing variables from enclosing frames) and curried/returned functions (`make_x`, `deriv`, `newtons_method`, `repeat_pattern`).","Use the variadic `*` operator (`def f(x, y, *z):` and `fn(*args)`) to accept and unpack variable-length arguments."],introParagraphs:["Up to Unit 02, functions only took numbers or pictures as inputs and returned values. **Higher-Order Functions (HOFs)** lift abstraction one level higher: they take *other functions as arguments* or *return new functions as results*.","In Lecture 4, we observe that `sum_integers`, `sum_cubes`, and `pi_sum` share the exact same skeleton — differing only in `term(a)` and `next(a)`. By passing functions as parameters, one template solves them all, and even computes numerical integrals (`integral`) and roots via Newton's Method (`newtons_method`)."],referenceTable:{id:"hof-patterns-table",title:"Core Lecture 4 Higher-Order Patterns",headers:["HOF","Inputs","Returns","Key Idea"],rows:[["`sum_series(term, a, next, b)`","2 functions + bounds","Number","Generalizes any finite series summation"],["`integral(f, a, b, dx)`","Function `f` + bounds","Number","Inner `add_dx` forms a **closure** capturing `dx`"],["`make_x(x)`","Value `x`","Function `() -> x`","`five` is a function object; `five()` returns `5`"],["`deriv(g)`","Function `g`","Function `g'`","Numerical derivative `(g(x+dx) - g(x)) / dx`"],["`newtons_method(g, guess)`","Function `g` + guess","Root `x` (`g(x)≈0`)","Combines `deriv`, `improve`, and recursive `attempt`"],["`fold2(op, term, a, next, b, base)`","3 functions + bounds + base","Combined value","Unifies `sum` (`+`, `0`) and `product` (`*`, `1`)"]]},admonitions:[{kind:"tip",title:"Exam Tracing Tip: Always Track Return Types",body:"When reading expressions like `twice(twice)(inc)(5)` or `deriv(cube)(5)`, evaluate strictly left-to-right and write down the type after each pair of parentheses: is it a **function** waiting for another call, or a final **value**?"}]},"sequences-trees":{topicId:"sequences-trees",slug:"04-sequences-trees",unitLabel:"Unit 04",shortTitle:"04. Data Abstraction, Trees & Files",group:"Intermediate",learningObjectives:["Design Abstract Data Types (ADTs) using Constructors, Selectors, Predicates, and Printers without violating the Data Abstraction Barrier.","Distinguish equivalence (`==`) from object identity (`is`), and construct single-element tuples `(x,)` safely.","Analyze the hidden `O(n²)` cost of tuple concatenation/slicing and why recursive tuple `reverse` uses `O(n²)` Space while iterative uses `O(n)` Space.","Process nested tuple trees and compose Signal-Processing pipelines (`enumerate → filter → map → accumulate`), accounting for one-time-use built-in iterators.",'Read and write text files using `open`, `readline()`, EOF sentinel `""`, and `write()`.'],introParagraphs:["Just as Functional Abstraction hides *how a procedure computes*, **Data Abstraction** (Lecture 5) hides *how compound data is represented*. Higher-level operations like `add_rat` talk to the underlying representation exclusively through Constructors (`make_rat`) and Selectors (`numer`, `denom`), forming a strict **Abstraction Barrier**.","Lecture 6 builds on immutable sequences (`tuple`) to represent hierarchical **trees** (via the closure property: tuples containing tuples), introduces the **Signal-Processing View** of sequence computation, and covers **File I/O** — the foundation of Practical Exam Q2."],referenceTable:{id:"seq-complexity-table",title:"Tuple Processing & ADT Summary (Lectures 5–6)",headers:["Operation / Concept","Behaviour / Complexity","Critical Exam Detail"],rows:[["`t1 + t2`","`O(len(t1) + len(t2))`","Creates a brand-new tuple copying both operands"],["Recursive tuple `reverse` / `scale_seq`","Time `O(n²)`, Space `O(n²)`","Holds `n` slices `seq[1:]` alive on the heap simultaneously"],["Iterative tuple `reverse` / `scale_seq`","Time `O(n²)`, Space `O(n)`","Still copies tuple each step, but only keeps 1 result tuple"],["`map(fn, seq)` / `filter(pred, seq)`","Lazy one-time iterable","Exhausted after 1st `tuple(...)` or `for` loop!"],["`f.readline()` EOF check",'Returns `""` at EOF','Blank lines return `"\\n"` (truthy), NOT `""`!']]},admonitions:[{kind:"warning",title:"Do Not Cross the Abstraction Barrier!",body:"In Midterm Data Abstraction questions, writing `r[0]` directly inside `add_rat(x, y)` instead of `numer(r)` loses marks even if it returns the right number — because your code breaks if the internal representation changes from a tuple to a dict or list."}]},"lists-search-sort":{topicId:"lists-search-sort",slug:"05-lists-search-sort",unitLabel:"Unit 05",shortTitle:"05. Lists, Mutation, Search & Sort",group:"Intermediate",learningObjectives:["Differentiate mutating list methods returning `None` (`append`, `extend`, `insert`, `remove`, `clear`, `reverse`, `sort`) from `pop(pos)` and the `del` statement.","Trace box-and-pointer memory diagrams for aliasing, shallow `copy()`, `[[0]*c]*r` pitfalls, and why `+=` differs from `= +` on lists vs. tuples.","Implement Linear Search (`O(n)`) and non-slicing Binary Search (`O(log n)`), explaining why slicing destroys `O(log n)` complexity.","Compare Lecture 7's Selection Sort, Merge Sort, and Python's built-in `lst.sort(key=, reverse=)` across Time, In-place status, and Stability."],introParagraphs:["Lecture 7 introduces **mutation** via Python's `list` type. Mutable objects make in-place updates fast (appending is `O(1)` amortized instead of `O(n)` tuple copying), but introduce **aliasing**: two variables pointing to the same list object will both observe any in-place mutation.","We then apply lists to two classic algorithmic tasks: **Searching** (Linear vs. Binary Search) and **Sorting** (Selection Sort, Merge Sort, and Python's built-in Timsort). Pay close attention to the exact Lecture 7 implementations — in CS1010A, Selection Sort builds a new list with strict `<`, making it **stable and NOT in-place**!"],referenceTable:{id:"lec7-sorting-table",title:"Lecture 7 Searching & Sorting Complexity Table (Strict Syllabus)",headers:["Algorithm (L7 Version)","Best","Average","Worst","In-Place?","Stable?"],rows:[["Linear Search","`O(1)`","`O(n)`","`O(n)`","—","—"],["Binary Search (`low`/`high`, sorted)","`O(1)`","`O(log n)`","`O(log n)`","—","—"],["Selection Sort (`new = []`, `<`)","`O(n²)`","`O(n²)`","`O(n²)`","**No**","**Yes**"],["Merge Sort (`merge`, `<=`)","`O(n log n)`","`O(n log n)`","`O(n log n)`","**No**","**Yes**"],["`lst.sort(key=, reverse=)`","`O(n)` / `O(n log n)`","`O(n log n)`","`O(n log n)`","**Yes**","**Yes**"]],footnote:"Note: Insertion Sort and Quick Sort are NOT in the CS1010A Lecture 7 syllabus. `sorted(seq)` is also stable `O(n log n)` and returns a new list (not in-place)."},admonitions:[{kind:"note",title:"`del` Is a Statement, Not a Function",body:"`del a[0]` has NO parentheses and returns NOTHING (not even `None`) — writing `b = del a[0]` is a `SyntaxError`. `del a[:]` empties the list in-place (visible to aliases), while `del a` only removes the variable name `a` (the list survives if another variable `b` still references it)."}]},"dicts-ds-pivoting":{topicId:"dicts-ds-pivoting",slug:"06-dicts-ds-pivoting",unitLabel:"Unit 06",shortTitle:"06. Dicts, Data Structures & Pivoting",group:"Intermediate",learningObjectives:["Use Python dictionaries (`{}`, `d[k]`, `d.get`, `k in d`, `del`, `.items()`) and choose effectively between Tuples, Lists, and Dictionaries.","Separate a Data Structure's Specification from its Implementation and representation constraints (Game of Nim & LIFO Stack).","Compare all four Lecture 8 Multiset representations (Unordered List, Ordered List, BST, Dictionary) across `adjoin_mset`, `multiplicity_of`, and `intersection_of`.","Apply Lecture 11 pure-Python data-wrangling techniques (wide vs. long form, dict-of-dicts pivoting, binning, `delta`, `mavg`, `zip(*rows)`, Top-K with ties) for PE Q2."],introParagraphs:["In Lecture 8, we examine a profound principle of software engineering: **the exact same Abstract Data Type can have multiple valid implementations with dramatically different performance trade-offs**. Using the **Multiset (Bag)** ADT, we compare Unordered Lists, Ordered Lists, Binary Search Trees, and Python Dictionaries side-by-side.","Combining dictionaries with Lecture 11's data-reshaping patterns — pivoting long-form records into `dict`-of-`dicts` or `dict`-of-`lists`, computing moving averages (`mavg`), daily differences (`delta`), histograms, and Top-K rankings with ties — equips you directly for **Practical Exam Question 2**."],referenceTable:{id:"tuple-list-dict-table",title:"Tuple vs. List vs. Dictionary Comparison (Lectures 6–8)",headers:["Property","Tuple `()`","List `[]`","Dictionary `{}`"],rows:[["Mutable?","No (immutable)","Yes","Yes (keys must be immutable/hashable)"],["Ordered / Indexed?","Yes (`0..n-1`)","Yes (`0..n-1`)","Key-based lookup (`d[k]`)"],["`x in seq`","`O(n)` (elements)","`O(n)` (elements)","`O(1)` (**KEYS only**, not values!)"],["Best used for","Fixed records, tree nodes, dict keys","Ordered mutable collections, stacks","Fast lookup, counting, grouping, pivoting"]]},admonitions:[{kind:"syllabus",title:"Practical Exam Rule (Lecture 11 Slide 67)",body:"Lecture 11 showcases `matplotlib`, `numpy`, `pandas`, and `seaborn` to illustrate real-world data visualisation, **but explicitly states these external libraries CANNOT be used in the Practical Exam (PE)**. Practice all Q2 pivoting, filtering, and aggregation in pure Python."}]},oop:{topicId:"oop",slug:"07-oop",unitLabel:"Unit 07",shortTitle:"07. Object-Oriented Programming",group:"Advanced",learningObjectives:["Explain the 4 pillars of OOP (Encapsulation, Data Abstraction, Inheritance, Polymorphism) and why OOP avoids procedural tuple-state bugs (`BankAccount`).","Design class hierarchies with `__init__`, `self`, and `super()` without passing `self` twice or using mutable default arguments.","Predict `isinstance(obj, Cls)` vs. `type(obj) == Cls` across multi-level inheritance hierarchies (Star Trek / Vehicles).","Trace dynamic `self` method dispatch (`Lecturer.lecture` calling `ArrogantLecturer.say`) and Multiple / Diamond Inheritance Method Resolution Order (`SingingArrogantLecturer`)."],introParagraphs:["Lecture 9 introduces **Object-Oriented Programming (OOP)** — a paradigm where data (attributes) and the operations that act on that data (methods) are bundled inside objects instantiated from class blueprints. Python is a multi-paradigm language (supporting Imperative, Functional, and OOP styles), and Practical Exam Question 3 is dedicated to OOP design.","The most frequently tested OOP subtleties in CS1010A are **dynamic `self` dispatch** (a superclass method calling `self.method()` executes the subclass's override!) and **Diamond Inheritance MRO** (`super()` follows the concrete instance's Method Resolution Order so all subclasses' methods execute before any shared superclass)."],referenceTable:{id:"oop-pillars-table",title:"The 4 Core OOP Principles & Python Mechanics (Lecture 9)",headers:["Concept","Meaning","Lecture 9 Example"],rows:[["Encapsulation","Bundle state + methods together inside one object","`BankAccount` holding `self.balance` + `deposit`/`withdraw`"],["Data Abstraction","Interact via public methods, hiding internal fields","Calling `acc.withdraw(30)` instead of mutating internals"],["Inheritance (`is-a`)","Subclass reuses & extends superclass behaviour","`NamedObject → MobileObject → Ship → EnemyShip`"],["Polymorphism","Same method call adapts to the concrete object's class","`Lecturer.lecture` calling `self.say()` → `ArrogantLecturer.say`"],["Diamond MRO","All subclasses run before a shared superclass","`SingingArrogantLecturer(ArrogantLecturer, Singer)` with `Singer(Speaker)`"]]},admonitions:[{kind:"tip",title:"How to Read `super()` in Any Exam Question",body:'Never translate `super()` as "my parent class". Always translate `super()` as **"the next class after me in `self`\'s MRO"**. That single mental shift makes every Diamond Inheritance question crystal clear.'}]},exceptions:{topicId:"exceptions",slug:"08-exceptions",unitLabel:"Unit 08",shortTitle:"08. Exceptions & Syllabus Scope",group:"Advanced",learningObjectives:["Distinguish Syntax Errors (caught before execution) from runtime Exceptions (`ZeroDivisionError`, `NameError`, `TypeError`, `ValueError`, `KeyError`, `IndexError`).",'Trace the exact execution order of `try`, `except`, `else`, and `finally` — including when an uncaught exception occurs (`divide_test("2", "1")`).',"Raise exceptions explicitly with `raise` and create custom exception subclasses inheriting from `Exception` (`MyError`).","Recognize Lecture 10's Memoization and Dynamic Programming concepts while noting Lecture 12's explicit confirmation that they will NOT appear on PE or Finals."],introParagraphs:["Real programs encounter invalid user input, missing files, and division by zero. **Exception handling** (Lecture 10) separates normal program logic from error-recovery logic using `try / except / else / finally` blocks instead of cluttering every function with nested `if` checks.","This unit also records the official **Lecture 12 Slide 32 syllabus clarification** regarding Memoization and Dynamic Programming so your exam revision stays laser-focused on examinable material."],referenceTable:{id:"exception-clauses-table",title:"`try / except / else / finally` Execution Matrix (Lecture 10)",headers:["Outcome inside `try:`","`except` runs?","`else` runs?","`finally` runs?","Propagates error?"],rows:[["No exception raised (`divide_test(2, 1)`)","No","**Yes**","**Yes**","No"],["Matching exception raised (`divide_test(2, 0)`)","**Yes**","**No**","**Yes**","No"],['Uncaught exception raised (`divide_test("2", "1")`)',"No","**No**","**Yes (FIRST!)**","**Yes (after `finally`)**"]]},admonitions:[{kind:"syllabus",title:"Lecture 12 Slide 32: Memoization & DP Not Tested on PE/Finals",body:'Although Lecture 10 introduces Memoization (`memo_fib`, `memoize(fn)`) and bottom-up Dynamic Programming (`dp_choose`, Chocolate Packing, `dp_prime`), **Lecture 12 explicitly states: "Memoization & Dynamic Programming — ALIASING & +=:

    return base if a > b else op(term(a), fold2(op, term, nxt(a), nxt, b, base))

# Signal-Processing pipeline: Enumerate -> Filter -> Map -> Accumulate
# WARNING: built-in map/filter are ONE-TIME iterables -> wrap in tuple()!

# Mutating y[0] += 1 does NOT rebind y -> works on outer list!

class Parent:
    def __init__(self, name, items=None):   # NEVER items=[] or cart={}!
        self.name = name
        self.items = [] if items is None else list(items)

class Child(Parent):
    def __init__(self, name, extra):
        super().__init__(name)              # NEVER pass self to super()!
        self.extra = extra

# isinstance(obj, Parent) -> True | type(obj) == Parent -> False
# Diamond MRO: all subclasses' methods run BEFORE shared superclass!`},{id:"sheet-8",title:"8. Exception Handling Control Flow (Lecture 10)",body:`try:
    result = x / y
except ZeroDivisionError:       # specific handlers first
    print("div by zero")
except:                         # wildcard MUST be last!
    print("other error")
else:                           # runs ONLY if try had NO exception
    print("ok:", result)
finally:                        # ALWAYS runs (even before uncaught error!)
    print("cleanup")

ONCE, not twice!), or disjoint split (`cc(a, k-1) + cc(a - coin, k)`)."},{step:5,title:"Dry-Run Base + 1 Step & Check Hidden Complexity",askYourself:"Did I accidentally turn `O(log n)` into `O(n)` or `O(n)` into `O(n²)`?",action:"Trace your smallest non-base case line by line. Never call `fast_expt(b, e//2)` twice; remember `tuple1 + tuple2` costs `O(len)`."}],skeleton:`def solve(x):

    return <combine(current_piece, solve(smaller_x))>`,workedProblem:"Write `sum_even_leaves(tree)` that returns the sum of all even integer leaves inside a nested tuple `tree`. Example: `sum_even_leaves(((1, 2), (), (4, (5, 6)))) -> 12`.",workedThoughtProcess:["Step 1 (Examples): `()` → `0`; `2` → `2`; `3` → `0`; `(2, 4)` → `6`.","Step 2 (Base cases): Empty tuple `tree == ()` returns `0`. Leaf `type(tree) != tuple` returns `tree` if `tree % 2 == 0` else `0`.","Step 3 (Wishful thinking): For a non-empty tuple `tree`, trust `sum_even_leaves(tree[0])` for the first branch and `sum_even_leaves(tree[1:])` for the rest.","Step 4 (Combine): Simply add them (`+`). Note `tree[1:]` (slice, NOT `tree[1]`) handles 1-element tuples like `(6,)` safely!"],workedSolution:`def sum_even_leaves(tree):
    if tree == ():
        return 0
    elif type(tree) != tuple:
        return tree if tree % 2 == 0 else 0
    else:
        return sum_even_leaves(tree[0]) + sum_even_leaves(tree[1:])`},{id:"hof",label:"HOFs & Signal Pipelines",lectureRef:"Lectures 4 & 6",whenToUse:'Question asks to "write a function that returns a function", abstract a series/fold pattern, or solve a sequence problem using `map`/`filter`/`accumulate` without loops.',steps:[{step:1,title:"Write the Call Signature & Return Type First",askYourself:"How will the grader call my function? `f(a)(b)` or `f(g, x)`?",action:"Count the pairs of parentheses! Each extra `(...)` means your function must `return lambda ...:` or `return inner_fn`.",watchOut:"Never confuse returning a function (`return lambda x: ...`) with calling it immediately!"},{step:2,title:"Separate What Is FIXED vs. What VARIES",askYourself:"Which parts stay the same across problems, and which parts are passed in as functions?",action:"Fixed structure = your HOF body (`fold2`, `sum_series`, `newtons_method`). Varying pieces = function parameters (`term`, `next_fn`, `op`, `pred`)."},{step:3,title:"Match the Identity `base` to `op`",askYourself:"What value changes nothing when combined with `op`?",action:'`+` → `0` | `*` → `1` | tuple `+` → `()` | string `+` → `""`. Check `a > b` or `seq == ()` returns `base`.'},{step:4,title:"For Sequences, Sketch the 4-Stage Pipeline",askYourself:"Can I express this as Enumerate → Filter → Map → Accumulate?",action:"1. Flatten/generate items (`enumerate_tree` / `range`) → 2. Keep matching (`filter`) → 3. Transform (`map`) → 4. Combine (`accumulate` / `sum`)."},{step:5,title:"Check Closures & One-Time Iterators",askYourself:"Will `map`/`filter` be read more than once? Does a lambda capture a changing loop variable?",action:"Wrap `tuple(map(...))` or `tuple(filter(...))` if inspected twice. Never pass `term(a)` where the function `term` itself is expected."}],skeleton:`# Pattern A: Function returning a function (Closure)

def make_mset():                 # Constructor
    return {}

def adjoin_mset(x, s):           # Mutator / Constructor op
    s[x] = s.get(x, 0) + 1
    return s

def multiplicity_of(x, s):       # Selector
    return s.get(x, 0)

# === ABOVE BARRIER (uses ONLY ADT ops above!) ===
def contains(x, s):              # Predicate
    return multiplicity_of(x, s) > 0`,workedProblem:"Implement a LIFO Stack ADT (`make_stack`, `is_empty`, `push`, `pop`) and write `reverse_list(lst)` using ONLY the Stack ADT operations.",workedThoughtProcess:["Step 1 (Barrier): `make_stack`, `is_empty`, `push`, `pop` know the internal list; `reverse_list` must NOT use `s[-1]` or `s.append()` directly.","Step 2 (Empty guard): `pop(s)` returns `None` when `is_empty(s)` is `True`.","Step 3 (Above barrier): Push every item from `lst` onto `s`, then pop until `is_empty(s)` into a new result list."],workedSolution:`def make_stack(): return []
def is_empty(s): return s == []
def push(s, item): s.append(item)
def pop(s): return None if is_empty(s) else s.pop()

def reverse_list(lst):           # Strictly ABOVE the abstraction barrier!
    s = make_stack()
    for x in lst:
        push(s, x)
    res = []
    while not is_empty(s):
        res.append(pop(s))
    return res`},{id:"data-algo",label:"Lists, Search/Sort & PE Q2",lectureRef:"Lectures 7, 8 & 11",whenToUse:"File/CSV processing, pivoting rows into dicts, frequency counting, Top-K rankings with ties, Binary Search, or custom sorting (PE Q2 & Finals).",steps:[{step:1,title:"Sketch the Data-Shape Pipeline First",askYourself:"What shape is my input, what intermediate dict do I need, and what exact output type is required?",action:"Draw: `file/rows [(country, date, val)]` → `dict {country: [vals]}` → `sorted list [(country, avg)]`. (Pure Python only — NO NumPy/Pandas in PE!)"},{step:2,title:"Check: Mutate In-Place or Return New?",askYourself:'Does the question say "modify `lst` in-place" or "return a new list without mutating `lst`"?',action:"In-place: `lst.sort(...)` (never assign `lst = lst.sort()`!). Non-mutating: `sorted(lst, ...)` or list comprehension."},{step:3,title:"Guard File EOF, Missing Keys & Empty Inputs",askYourself:"What happens on `[]`, missing keys, header rows, or trailing `\\n`?",action:"Read with `while line != '':` + `line.strip().split(',')`. Initialize dict buckets with `if k not in d: d[k] = []`."},{step:4,title:"Write Multi-Key Sort Tuples & Tie Cutoffs",askYourself:"How are ties broken? Does Top-K include everyone tied at rank `k`?",action:"Use tuple keys: `key=lambda r: (-r[1], r[0])` (score DESC, name ASC). For ties at `k`, grab `cutoff = ranked[k - 1][1]` and filter `>= cutoff`."},{step:5,title:"Sanity-Check Time Complexity",askYourself:"Am I accidentally doing `O(n²)` work or slicing inside Binary Search?",action:"Use a `dict` (`O(1)` lookup) instead of scanning a list in a loop. In Binary Search, pass `(low, high)` indices and check `if low > high: return False`."}],skeleton:`def analyze_rows(rows, k):
    # 1. Pivot / aggregate into a dictionary
    groups = {}
    for key, val in rows:
        if key not in groups:
            groups[key] = []
        groups[key].append(val)

    # 2. Compute summary metric per group
    summary = [(key, sum(vals) / len(vals)) for key, vals in groups.items()]

    # 3. Multi-key sort: metric DESC, key ASC
    ranked = sorted(summary, key=lambda r: (-r[1], r[0]))

    # 4. Top-K INCLUDING ties at k-th position
    if len(ranked) <= k:
        return ranked
    cutoff = ranked[k - 1][1]
    return [r for r in ranked if r[1] >= cutoff]`,workedProblem:"Given `records = [(student, score), ...]`, return the top `k` students by average score (highest first, alphabetical tie-break), including all ties at the `k`-th score.",workedThoughtProcess:["Step 1 (Shape): `[(name, score)]` → `{name: [scores]}` → `[(name, avg)]` → sorted + tie-filtered.","Step 2 (Missing key): Check `if name not in totals:` before appending `score`.","Step 3 (Sort key): `(-avg, name)` sorts highest average first and breaks equal averages alphabetically.","Step 4 (Edge case): If `len(ranked) <= k` or `k <= 0`, return early without `IndexError`!"],workedSolution:`def top_k_students(records, k):
    if k <= 0 or not records:
        return []
    buckets = {}
    for name, score in records:
        if name not in buckets:
            buckets[name] = []
        buckets[name].append(score)
    avgs = [(name, sum(sc) / len(sc)) for name, sc in buckets.items()]
    ranked = sorted(avgs, key=lambda r: (-r[1], r[0]))
    if len(ranked) <= k:
        return ranked
    cutoff = ranked[k - 1][1]
    return [r for r in ranked if r[1] >= cutoff]`},{id:"oop",label:"Object-Oriented (OOP)",lectureRef:"Lecture 9 (PE Q3 & Finals)",whenToUse:"Question asks you to design classes, subclasses, interacting entities (BankAccount, Ships, Game Characters, Lecturers), or extend an existing class hierarchy.",steps:[{step:1,title:'Mark Up the Prompt: Nouns, "is-a", "has-a", Verbs',askYourself:"What are the classes, which inherits from which, what state does each hold, and what can it do?",action:'Nouns → `class`; "is a kind of" → `class Child(Parent):`; "has a" → `self.attr` inside `__init__`; Verbs → `def method(self, ...):`.'},{step:2,title:"Draw the Inheritance Tree + Attribute Table",askYourself:"Which attributes belong in the parent class so subclasses don't duplicate them?",action:"Put shared attributes in the parent `__init__`. Subclass `__init__` calls `super().__init__(...)` first, then sets only its NEW attributes."},{step:3,title:"Audit `__init__` for the Two Fatal OOP Traps",askYourself:"Did I pass `self` into `super()`? Did I write `items=[]` or `bag={}` as a default?",action:"ALWAYS write `super().__init__(name)` (NO `self`!) and `items=None` → `self.items = [] if items is None else list(items)`.",watchOut:"Mutable default args in `__init__` cause all instances to share the same list/dict!"},{step:4,title:"Decide: Inherit, Override, or Extend via `super()`?",askYourself:"Does the subclass behave identically, completely differently, or add extra behaviour on top of the parent?",action:"Identical → don't rewrite it. Add on top → call `super().method(...)` and build on its result. Remember `self.other_method()` dispatches polymorphically!"},{step:5,title:"Check Type Tests & Return Values vs. Mutations",askYourself:"Does each method mutate `self`, return a string/value, or both?",action:"Use `isinstance(obj, Parent)` (NEVER `type(obj) == Parent`) when checking class membership across subclasses."}],skeleton:`class Parent:
    def __init__(self, name, items=None):
        self.name = name
        self.items = [] if items is None else list(items)

    def describe(self):
        return self.name

class Child(Parent):
    def __init__(self, name, bonus, items=None):
        super().__init__(name, items)      # NEVER pass self!
        self.bonus = bonus

    def describe(self):
        return super().describe() + " (+" + str(self.bonus) + ")"`,workedProblem:"Design `Account(owner, balance)` with `deposit(amt)` and `withdraw(amt)` (returns `False` if insufficient), and subclass `SavingsAccount(owner, balance, rate)` with `add_interest()` and an overridden `withdraw(amt)` that charges a `$1` fee.",workedThoughtProcess:["Step 1 (Hierarchy): `SavingsAccount` **is-a** `Account`. `Account` has `owner`, `balance`; `SavingsAccount` adds `rate`.","Step 2 (`__init__`): `SavingsAccount.__init__` calls `super().__init__(owner, balance)` and stores `self.rate = rate`.","Step 3 (Extend via `super()`): `SavingsAccount.withdraw(amt)` simply delegates `return super().withdraw(amt + 1)` — reusing the balance check cleanly without duplicating code!"],workedSolution:`class Account:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self.balance = balance

    def deposit(self, amt):
        self.balance += amt
        return self.balance

    def withdraw(self, amt):
        if amt > self.balance:
            return False
        self.balance -= amt
        return True

class SavingsAccount(Account):
    def __init__(self, owner, balance=0, rate=0.02):
        super().__init__(owner, balance)
        self.rate = rate

    def add_interest(self):
        self.balance += self.balance * self.rate
        return self.balance

    def withdraw(self, amt):
        return super().withdraw(amt + 1)   # reuses parent check!`},{id:"exceptions",label:"Exception Handling",lectureRef:"Lecture 10",whenToUse:"Question asks you to safely handle invalid inputs/files, define a custom exception (`MyError`), or guarantee cleanup with `finally`.",steps:[{step:1,title:"Isolate ONLY the Risky Lines Inside `try:`",askYourself:"Which exact operations can fail (`x / y`, `int(s)`, `d[k]`, `open(...)`)?",action:"Keep `try:` small so you don't accidentally catch an unrelated bug from later lines."},{step:2,title:"Order `except` Clauses Specific → General",askYourself:"Which exact exception types should be caught (`ValueError`, `ZeroDivisionError`, `MyError`)?",action:"List specific exceptions first; put any wildcard `except:` LAST (otherwise `SyntaxError`). Use `except MyError as e:` to read `e.value`."},{step:3,title:"Split Success (`else:`) vs. Always-Run (`finally:`)",askYourself:"Should this line run ONLY when `try` succeeds, or ALWAYS (even on error)?",action:"Success-only logic → `else:`. Cleanup (closing files, logging completion) → `finally:` (runs even before uncaught exceptions!)."},{step:4,title:"Custom Exceptions Inherit from `Exception`",askYourself:"Do I need to signal a domain-specific error back to the caller?",action:"Write `class MyError(Exception):` with `__init__` and `__str__`, then trigger it with `raise MyError(...)`."}],skeleton:`class CustomError(Exception):
    def __init__(self, value):
        self.value = value
    def __str__(self):
        return repr(self.value)

def safe_op(x, y):
    try:
        res = x / y
    except ZeroDivisionError:
        return None
    except TypeError:
        raise CustomError("bad types")
    else:
        return res
    finally:
        pass   # ALWAYS runs (even before return or uncaught error!)`,workedProblem:'Write `safe_avg(str_nums)` that parses a list of strings into integers, ignoring non-integer strings, and raises `ValueError("no valid numbers")` if none are valid.',workedThoughtProcess:["Step 1 (Risky line): `int(s)` can raise `ValueError` — isolate it inside `try:`.","Step 2 (Success path): Put `valid.append(val)` inside `else:` (runs only if `int(s)` succeeded).",'Step 3 (Empty check): After the loop, if `not valid:`, `raise ValueError("no valid numbers")`.'],workedSolution:`def safe_avg(str_nums):
    valid = []
    for s in str_nums:
        try:
            val = int(s)
        except ValueError:
            continue
        else:
            valid.append(val)
    if not valid:
        raise ValueError("no valid numbers")
    return sum(valid) / len(valid)`}],fb=[{id:"var-table",title:"1. Variable State Table",bestFor:"Loops, conditionals, `and`/`or`, variable scoping & `UnboundLocalError`",howToDraw:"Draw columns: `Line | var1 | var2 | Output`. Never erase old values — cross them out and write the new value underneath so you can backtrack mistakes.",goldenRule:"Before running a function body, scan ALL lines inside `def` for `=` or `+=` to mark which variables are LOCAL vs. FREE!"},{id:"box-arrow",title:"2. Box-and-Pointer Diagram",bestFor:"Lists, nested lists, `copy()`, `del`, `+=` vs `= +`, mutable default args",howToDraw:"Draw variable names on the LEFT, list boxes with memory IDs (`0x1`, `0x2`) on the RIGHT, and ARROWS from variables/slots to boxes.",goldenRule:"In-place ops (`append`, `+=` on list, `lst[i] = ...`) change the BOX (every arrow pointing there sees it). Assignment (`a = ...`) moves ONLY `a`'s arrow!"},{id:"call-stack",title:"3. Call Stack & Type Annotations",bestFor:"Recursion (linear & tree), closures, and Higher-Order Function chains",howToDraw:"Stack frames downward with their local args + deferred expression on the right (e.g., `4 * [wait] - 1`). Unwind strictly from bottom frame back up. For HOFs, label every sub-expression `[func]` or `[val]`.",goldenRule:"In tree recursion, finish the ENTIRE left branch (and cross out its frames) before drawing the right branch."},{id:"mro-clauses",title:"4. MRO Line & Clause Checklist",bestFor:"OOP Inheritance / Diamond MRO (`super()`, `self`) & `try/except/else/finally`",howToDraw:"For OOP, write `ConcreteClass MRO: C → A → B → Base → object` on ONE line at the top of your paper. For exceptions, write `[try] [except] [else] [finally]` and tick/cross each box.",goldenRule:"`self.m()` ALWAYS starts at the LEFT end of the concrete object's MRO; `super().m()` moves ONE step right from the *current class* in that same MRO!"}],Yo=[{id:"drill-aliasing",title:"Drill 1: Shallow Copy, Aliasing & `+=` vs `= +`",topicTag:"Lecture 7 • L
